apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: site-template-ingress
  namespace: default
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  rules:
  - host: site-template.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: site-template-service
            port:
              number: 80
